<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it, env(safe-area-inset-*) is always 0
         and the chat button hides behind the iPhone home bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Chog Poker — multi-table tournament poker for the Chog community. Free to play, Discord sign-in, live tables." />
    <meta name="theme-color" content="#0a0518" />
    <title>Chog Poker · Chog Games</title>
    <!-- Rich embeds when a table or tournament link is shared (Discord, WhatsApp, iMessage). -->
    <meta property="og:site_name" content="Chog Poker" />
    <meta property="og:title" content="Chog Poker" />
    <meta property="og:description" content="Join the table — free multi-table tournament poker with friends." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Chog Poker" />
    <meta name="twitter:description" content="Join the table — free multi-table tournament poker with friends." />
    <!-- Outfit is bundled (client/src/fonts) — no font CDN needed. -->
    <!-- The same badge ChogLogo draws: violet tile, pink ring, cream spade.
         Inline so the tab icon never depends on an asset that may not be
         uploaded yet. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='3' y='3' width='94' height='94' rx='27' fill='%232b1764' stroke='%23d53f7c' stroke-width='6'/><path d='M50 21 C38.5 36.5 26.5 44.5 26.5 56.2 c0 8.4 6.5 14.4 14.2 14.4 3 0 5.6-.8 7.6-2.3 -.9 6.3-3.2 10.2-7.5 13.7 v3.6 h18.4 v-3.6 c-4.3-3.5-6.6-7.4-7.5-13.7 2 1.5 4.6 2.3 7.6 2.3 C67 70.6 73.5 64.6 73.5 56.2 73.5 44.5 61.5 36.5 50 21 Z' fill='%23fdf6cd'/></svg>" />
    <!-- The supplied artwork, when it is there, wins: it is listed last. -->
    <link rel="icon" type="image/png" href="/chog-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

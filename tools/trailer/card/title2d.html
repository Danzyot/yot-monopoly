<!doctype html>
<meta charset="utf-8">
<!-- Shot 1's end card: the 3D title turned 2D, drawn on a canvas at the exact letter
     boxes Blender measured (title-layout.json), with the Chog as a circle mark in the O's
     place. draw(t) paints the card t seconds after it starts; render-canvas.mjs steps t
     frame by frame. -->
<style>
  @font-face { font-family: 'Titan One'; src: url('titan-one-400.woff2') format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 800; src: url('nunito-800.woff2') format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 700; src: url('nunito-700.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const PURPLE = '#5d3fbd';
const c = document.getElementById('c');
const g = c.getContext('2d');
const art = new Image();
art.src = 'chog-line.png';
let L = null;
window.ready = (async () => {
  L = await (await fetch('title-layout.json')).json();
  await document.fonts.load('100px "Titan One"');
  await document.fonts.load('800 40px Nunito');
  await document.fonts.load('700 40px Nunito');
  await art.decode();
})();
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const backOut = x => { x = clamp(x); const s = 1.7; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };

function letter(ch, box) {
  // Fit the glyph's ink box to the measured box: same height, same centre.
  const ref = 200;
  g.font = `${ref}px "Titan One"`;
  const m = g.measureText(ch);
  const inkH = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  const fs = ref * ((box.y1 - box.y0) * H) / inkH;
  g.font = `${fs}px "Titan One"`;
  const n = g.measureText(ch);
  const inkL = -n.actualBoundingBoxLeft, inkR = n.actualBoundingBoxRight;
  const cx = (box.x0 + box.x1) / 2 * W, by = box.y1 * H;
  const x = cx - (inkL + inkR) / 2;
  const y = by - n.actualBoundingBoxDescent;
  g.lineJoin = 'round';
  g.lineWidth = fs * 0.03;
  g.strokeStyle = PURPLE;
  g.fillStyle = PURPLE;
  g.fillText(ch, x, y);
  g.strokeText(ch, x, y);
  return fs;
}

function mark(box, t) {
  const cx = (box.x0 + box.x1) / 2 * W, cy = (box.y0 + box.y1) / 2 * H;
  const r = (box.y1 - box.y0) * H * 0.5;
  const s = 0.86 + 0.14 * backOut(seg(t, 0.05, 0.55));
  g.save();
  g.translate(cx, cy);
  g.scale(s, s);
  g.beginPath();
  g.arc(0, 0, r * 0.93, 0, Math.PI * 2);
  g.fillStyle = '#f7f2ff';
  g.fill();
  g.save();
  g.clip();
  const size = r * 2.05;
  g.drawImage(art, -size * 0.555, -size * 0.6, size, size);
  g.restore();
  g.lineWidth = r * 0.17;
  g.strokeStyle = PURPLE;
  g.beginPath();
  g.arc(0, 0, r * 0.93, 0, Math.PI * 2);
  g.stroke();
  g.restore();
}

window.draw = (t) => {
  const bg = g.createRadialGradient(W / 2, H * 0.48, 40, W / 2, H * 0.5, W * 0.62);
  bg.addColorStop(0, '#f6f1ff');
  bg.addColorStop(1, '#ddd0f7');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);
  g.textBaseline = 'alphabetic';
  L.letters.forEach((b, i) => { if (i !== 2) letter(b.char, b); });
  mark(L.letters[2], t);
};
</script>

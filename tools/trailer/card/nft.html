<!doctype html>
<meta charset="utf-8">
<!-- "Your Chog": four NFT cards pop up in a row, float, then flip one after another; on
     each card's back the same Chog stands in 3D (its turn sequence from the capture step,
     nft/turn-<token>/NNNN.png with alpha) and hops out over the card's edge.
     nft/manifest.json lists the tokens in order: [{token, label}]. -->
<style>
  @font-face { font-family: 'Titan One'; src: url('titan-one-400.woff2') format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 800; src: url('nunito-800.woff2') format('woff2'); }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b0614; }
  #bg { position: absolute; inset: 0; background: radial-gradient(ellipse 65% 60% at 50% 60%, #3a1a72 0%, #1c0c38 45%, #0b0614 80%); }
  #stage { position: absolute; inset: 0; perspective: 1800px; }
  .card { position: absolute; top: 330px; width: 340px; height: 440px; transform-style: preserve-3d; }
  .face { position: absolute; inset: 0; border-radius: 26px; backface-visibility: hidden; overflow: hidden;
          box-shadow: 0 40px 90px rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.14); }
  .front { background: #f4efff; }
  .front img { display: block; width: 312px; height: 312px; margin: 14px; border-radius: 16px; object-fit: cover; }
  .front .lab { font: 800 30px Nunito; color: #3e2c86; text-align: center; margin-top: 18px; }
  .back { transform: rotateY(180deg); background: radial-gradient(circle at 50% 38%, #8b5cf6 0%, #4c1d95 55%, #1e0b46 100%); }
  .back .lab { position: absolute; bottom: 22px; width: 100%; text-align: center; font: 28px 'Titan One'; color: #fff; opacity: 0.9; }
  .chog { position: absolute; width: 470px; height: 470px; left: -65px; top: -150px; pointer-events: none; }
</style>
<div id="bg"></div>
<div id="stage"></div>
<script>
window.screenshot = true;
const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const backOut = x => { x = clamp(x); const s = 1.7; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
let cards = [];
window.ready = (async () => {
  const list = await (await fetch('nft/manifest.json')).json();
  list.forEach((n, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.style.left = `${960 + (i - (list.length - 1) / 2) * 410 - 170}px`;
    el.innerHTML = `<div class="face front"><img src="nft/${n.token}.png"><div class="lab">${n.label}</div></div>` +
      `<div class="face back"><div class="lab">${n.label}</div></div>`;
    const chog = document.createElement('img');
    chog.className = 'chog';
    el.appendChild(chog);
    stage.appendChild(el);
    cards.push({ el, chog, n });
  });
  await document.fonts.load('28px "Titan One"');
  await document.fonts.load('800 30px Nunito');
  await Promise.all([...document.images].map(im => im.decode().catch(() => {})));
})();

window.draw = async t => {
  const waits = [];
  cards.forEach((c, i) => {
    const pop = backOut(seg(t, 0.2 + 0.25 * i, 0.6 + 0.25 * i));
    const flip = smooth(seg(t, 1.5 + 0.12 * i, 2.05 + 0.12 * i));
    const bob = 10 * Math.sin(2 * Math.PI * 0.5 * t + i * 1.3);
    const tilt = (i - 1.5) * -4 * (1 - flip);
    c.el.style.opacity = clamp(pop * 4);
    c.el.style.transform = `translateY(${bob + 80 * (1 - pop)}px) scale(${0.3 + 0.7 * pop}) rotateY(${180 * flip + tilt}deg)`;
    // The 3D Chog shows once the back faces us, playing its turn sequence.
    const f0 = 1.85 + 0.12 * i;
    const show = seg(t, f0, f0 + 0.15);
    c.chog.style.opacity = show;
    c.chog.style.transform = `rotateY(180deg) translateZ(40px) scale(${0.8 + 0.2 * backOut(seg(t, f0, f0 + 0.4))})`;
    if (show > 0) {
      const k = Math.min(47, Math.max(0, Math.floor((t - f0) * 24)));
      const src = `nft/turn-${c.n.token}/${String(k).padStart(4, '0')}.png`;
      if (c.chog.getAttribute('src') !== src) { c.chog.src = src; waits.push(c.chog.decode().catch(() => {})); }
    }
  });
  await Promise.all(waits);
};
</script>

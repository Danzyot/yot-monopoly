<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2a72" />
    <!-- Search and link previews. The server swaps this block for each page's own tags
         (server/src/seo.ts, from shared/seo.ts), so keep the markers. These are the home page's. -->
    <!--seo-->
    <title>Chog Games: Monopoly, cards and poker with the Chog crew</title>
    <meta name="description" content="Play Monopoly, Chog Cards and poker with the Chog crew. Open a table, share the code and play with friends in your browser. Free, nothing to download." />
    <link rel="canonical" href="https://choggames.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chog Games" />
    <meta property="og:title" content="Chog Games: Monopoly, cards and poker with the Chog crew" />
    <meta property="og:description" content="Play Monopoly, Chog Cards and poker with the Chog crew. Open a table, share the code and play with friends in your browser. Free, nothing to download." />
    <meta property="og:url" content="https://choggames.com/" />
    <meta property="og:image" content="https://choggames.com/brand/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chog Games: Monopoly, cards and poker with the Chog crew" />
    <meta name="twitter:description" content="Play Monopoly, Chog Cards and poker with the Chog crew. Open a table, share the code and play with friends in your browser. Free, nothing to download." />
    <meta name="twitter:image" content="https://choggames.com/brand/og.jpg" />
    <!--/seo-->
    <!-- The Chog mark (client/public/brand/, drawn from editions/chog/logo.png): favicons, the
         home-screen icon and the install manifest (display: standalone, no service worker). -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/brand/icon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/brand/icon-16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="/brand/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-title" content="Chog Games" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- The faces the first screen is set in (the hero's Titan One, the headings' and
         header's Lilita One, the body's and status line's Nunito), fetched with the page rather than
         after the styles, so the text is not drawn twice and nothing shifts. -->
    <link rel="preload" href="/src/fonts/titan-one-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/lilita-one-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/nunito-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/nunito-800.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The home page's backdrop, a still of the board (styles/home.css and, in the Chog season,
         styles/season.css: same files, same media queries). -->
    <script>
      if (location.pathname === '/') {
        var still = document.documentElement.classList.contains('season-chog') ? 'chog-board' : 'board';
        [['/home/' + still + '-960.webp', '(max-aspect-ratio: 4/5)'], ['/home/' + still + '-1920.webp', '(min-aspect-ratio: 4/5)']].forEach(function (p) {
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.type = 'image/webp'; l.href = p[0]; l.media = p[1];
          l.setAttribute('fetchpriority', 'high');
          document.head.appendChild(l);
        });
      }
    </script>
    <!-- Inter and Oswald are only fallbacks and board lettering: they never hold up the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
